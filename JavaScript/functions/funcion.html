<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        let n1 = Number(prompt('escolha um numero:'))
        let n2 = Number(prompt('escolha outro numero:'))


        function somar (a, b) {
            let soma = a + b
            return soma
        }

        function subtrair (a, b) {
            let sub = 0
            if ( a > b ) {
                sub = a - b
            } else {
                sub = b - a
            }
            return sub
        }

        function multiplicar (a, b) {
            let mult = a*b
            return mult
        }

        alert( 'soma: ' + somar(n1,n2))
        alert( 'subtração: ' + subtrair(n1,n2))
        alert( 'multiplicação: ' + multiplicar(n1,n2))
    </script>
</body>
</html>
