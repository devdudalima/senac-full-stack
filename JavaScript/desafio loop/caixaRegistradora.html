<body>
    
    <script>

  
        let valor = 1
        let total = 0
        let comprasRegistradas = 0

        while ( valor != 0 ) {

            valor = Number (prompt('digite o valor da compra:'))

            comprasRegistradas = comprasRegistradas + 1

            total = total + valor

        } alert ('compras registradas: ' + comprasRegistradas + ' valor total arrecadado: R$ ' + total )

    </script>
