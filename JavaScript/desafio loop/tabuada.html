<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        let numero = Number (prompt('digite um numero:'))
        
        for ( c = 0 ; c <= 10; c++) {

            let multipicar = numero * c

            console.log( numero + ' x ' + c + ' = ' + multipicar )

        }
    </script>
</body>
