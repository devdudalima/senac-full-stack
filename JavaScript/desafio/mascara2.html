<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="mascara2.css">
</head>
<body>
    <form>
        <h1>VERIFICADOR DE DADOS</h1>
        <label for="nome">NOME:</label>
        <input type="text" id="nome" placeholder="Apenas letras" required>

        <label for="cpf">CPF:</label>
        <input type="text"id="cpf" placeholder="000.000.000-00"required>

        <label for="cep">CEP:</label>
        <input type="text" id="cep" placeholder="Apenas números (8 digitos)"required>

        <label for="uf">UF:</label>
        <input type="text" id="uf" placeholder="ex: SP"required>

        <label for="senha">SENHA:</label>
        <input type="text" id="senha" placeholder="Digite uma senha forte" maxlength="25" required>

        <div class="contador">Caracteres digitados <span id="contadorSenha">0</span></div>

        <ul class="requisitos">
            <li id="req-tamanho">Mínimo de 8 caracteres</li>
            <li id="req-maiuscula">Pelo menos uma letra maiúscula</li>
            <li id="req-minuscula">Pelo menos uma letra minúscula</li>
            <li id="req-numero">Pelo menos um número</li>
            <li id="req-especial">Pelo menos um caractere especial (ex: @, #, $, etc.)</li>
        </ul>

        <button id="verificar" type="submit">verificar</button>

    </form>

    <script src="mascara2.js"></script>
</body>
</html>
