<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form>
        <!-- Nome -->
        <div class="campo">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Apenas letras">
        </div>
        <!-- CPF -->
        <div class="campo">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00">
        </div>
        <!-- RG -->
        <div class="campo">
            <label for="rg">RG:</label>
            <input type="text" id="rg" placeholder="Apenas números">
        </div>
        <!-- CEP -->
        <div class="campo">
            <label for="cep">CEP:</label>
            <input type="text" id="cep" maxlength="8" placeholder="Apenas
números (8 dígitos)">
        </div>
        <!-- Endereço -->
        <div class="campo">
            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" placeholder="Rua, número,
bairro">
        </div>
        <!-- UF -->
        <div class="campo">
            <label for="uf">UF:</label>
            <input type="text" id="uf" maxlength="2" placeholder="Ex: SP">
        </div>
        <!-- Senha com validação avançada -->
        <div class="campo">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Digite sua
senha forte">
            <div class="contador">Caracteres digitados: <span id="contadorSenha">0</span></div>

            <!-- Lista de regras visuais -->
            <ul class="requisitos">
                <li id="req-tamanho">Mínimo de 8 caracteres</li>
                <li id="req-maiuscula">Pelo menos uma letra maiúscula</li>
                <li id="req-minuscula">Pelo menos uma letra minúscula</li>
                <li id="req-numero">Pelo menos um número</li>
                <li id="req-especial">Pelo menos um caractere especial
                    (ex: @, #, $, etc.)</li>
            </ul>
        </div>
    </form>

    <script src="resposta.js"></script>

</body>

</html>
