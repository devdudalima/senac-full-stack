<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>First JavasCript</h1>
    
    <script>
        
        let numero1 = prompt("digite o primeiro número:")
        let numero2 = prompt("digite o segundo número:")

        let soma = parseInt(numero1) + parseInt(numero2)
        let subtracao = parseInt(numero1) - parseInt(numero2)
        let multiplicacao = parseInt(numero1) * parseInt(numero2)
        let divisao = parseInt(numero1) / parseInt(numero2)

        alert( numero1 + " + " + numero2 + " = " + soma )
        alert( numero1 + " - " + numero2 + " = " + subtracao )
        alert( numero1 + " x " + numero2 + " = " + multiplicacao )
        alert( numero1 + " ÷ " + numero2 + " = " + divisao )

    </script>
</body>
</html>
